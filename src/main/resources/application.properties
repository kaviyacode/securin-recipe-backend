# Project Information
spring.application.name=securin

# 1. SERVER CONFIGURATION
# Changed to 8081 to avoid "Port already in use" errors
server.port=8081

# 2. DATABASE CONFIGURATION (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:recipedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 3. H2 CONSOLE SETTINGS
# Access this at http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# This setting ensures the console works properly in modern browsers
spring.h2.console.settings.web-allow-others=true

# 4. JPA & HIBERNATE SETTINGS
# 'update' automatically creates tables based on your Recipe.java entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 5. JSON & API SETTINGS
spring.jackson.serialization.indent_output=true
spring.jackson.default-property-inclusion=non_null

# 6. CORS SETTINGS (Crucial for Frontend)
# Allows your React app (on port 3000) to fetch data from this backend
spring.mvc.cors.allowed-origins=http://localhost:3000

# 7. LOGGING
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.kaviya.securin=INFO